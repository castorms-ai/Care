<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚗 DRIFT WORLD</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#game {
  position: relative;
  width: 100%;
  max-width: 500px;
  height: 100vh;
  max-height: 800px;
  background: #2a3a1a;
  overflow: hidden;
  border: 3px solid #333;
  border-radius: 12px;
}
#world {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
#ground {
  position: absolute;
  left: -2000px;
  top: -2000px;
  width: 6000px;
  height: 6000px;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 99px, rgba(0,0,0,0.15) 99px, rgba(0,0,0,0.15) 100px),
    repeating-linear-gradient(90deg, transparent 0, transparent 99px, rgba(0,0,0,0.15) 99px, rgba(0,0,0,0.15) 100px),
    radial-gradient(circle at 50% 50%, #3d5024 0%, #2a3a1a 100%);
}

.obstacle {
  position: absolute;
  width: 50px;
  height: 50px;
  background: #6b4423;
  border: 3px solid #3d2413;
  border-radius: 8px;
  box-shadow: 0 6px 0 #00000055;
  z-index: 2;
}
.obstacle.rock {
  background: #555;
  border-color: #333;
  border-radius: 50%;
}

.coin {
  position: absolute;
  width: 28px;
  height: 28px;
  font-size: 26px;
  line-height: 28px;
  text-align: center;
  z-index: 3;
  animation: coinSpin 2s infinite;
  filter: drop-shadow(0 0 8px #ffd700);
}
@keyframes coinSpin {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.3); }
}

.skid {
  position: absolute;
  width: 6px;
  height: 20px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 3px;
  z-index: 1;
  pointer-events: none;
}

/* ==== МАШИНА ИГРОКА ==== */
#car {
  position: absolute;
  width: 56px;
  height: 100px;
  z-index: 5;
  transition: none;
  will-change: transform;
}
#carBody {
  position: absolute;
  inset: 0;
}
#carImg {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 110px;
  height: 65px;
  background: url('Care1.png') center/contain no-repeat;
  filter: drop-shadow(0 4px 8px #000000aa);
  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center;
}

/* ==== МАШИНА КОПОВ ==== */
.police {
  position: absolute;
  width: 56px;
  height: 100px;
  z-index: 6;
  transition: none;
  will-change: transform;
}
.policeBody {
  position: absolute;
  inset: 0;
}
.policeImg {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 110px;
  height: 65px;
  background: url('Pcare1.png') center/contain no-repeat;
  filter: drop-shadow(0 4px 8px #000000aa);
  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center;
}

/* Дым */
.smoke {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 4;
}
.smoke.drift {
  width: 22px;
  height: 22px;
  background: radial-gradient(circle, rgba(220,220,220,0.75) 0%, rgba(220,220,220,0) 70%);
  animation: smokeFade 1s forwards;
}
.smoke.idle {
  width: 10px;
  height: 10px;
  background: radial-gradient(circle, rgba(200,200,200,0.4) 0%, rgba(200,200,200,0) 70%);
  animation: smokeIdle 0.8s forwards;
}
@keyframes smokeFade {
  0% { transform: scale(0.5); opacity: 0.9; }
  100% { transform: scale(2.2); opacity: 0; }
}
@keyframes smokeIdle {
  0% { transform: scale(0.4); opacity: 0.5; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Всплывающие очки */
.floatScore {
  position: absolute;
  color: #ffd700;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 0 0 8px #ffd700, 2px 2px 3px #000;
  z-index: 25;
  pointer-events: none;
  animation: floatUp 1.2s forwards;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(0.6); opacity: 0; }
  20% { transform: translateY(-15px) scale(1.2); opacity: 1; }
  100% { transform: translateY(-60px) scale(1); opacity: 0; }
}

/* ==== HUD ==== */
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 20;
  pointer-events: none;
}
#speedo {
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  border: 2px solid #ffd70088;
}
#scoreHud {
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  border: 2px solid #ffd70088;
}
#recordHud {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  color: #ffd700;
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: bold;
  z-index: 20;
  pointer-events: none;
}
#coinHud {
  background: rgba(0,0,0,0.7);
  color: #ffd700;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  border: 2px solid #ffd70088;
}
#crashHud {
  position: absolute;
  top: 60px;
  left: 15px;
  background: rgba(0,0,0,0.7);
  color: #ff5252;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  border: 2px solid #ff525288;
  z-index: 20;
  pointer-events: none;
}
#timerHud {
  position: absolute;
  top: 100px;
  left: 15px;
  background: rgba(0,0,0,0.7);
  color: #4fc3f7;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  border: 2px solid #4fc3f788;
  z-index: 20;
  pointer-events: none;
}
#driftHud {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  color: #ff5722;
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 10px #ff5722, 2px 2px 4px #000;
  z-index: 20;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
#driftHud.show { opacity: 1; }
#alertMsg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  color: #ff1744;
  font-size: 40px;
  font-weight: bold;
  text-shadow: 0 0 30px #ff1744, 3px 3px 6px #000;
  z-index: 25;
  pointer-events: none;
  transition: transform 0.3s;
}
#alertMsg.show {
  transform: translate(-50%, -50%) scale(1);
}

#touchLeft, #touchRight {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  z-index: 15;
  pointer-events: auto;
}
#touchLeft { left: 0; }
#touchRight { right: 0; }

#touchLeft::before {
  content: '◀';
  position: absolute;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 60px;
  color: rgba(255,255,255,0.15);
  pointer-events: none;
}
#touchRight::after {
  content: '▶';
  position: absolute;
  right: 30px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 60px;
  color: rgba(255,255,255,0.15);
  pointer-events: none;
}

#hint {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 13px;
  text-shadow: 2px 2px 4px #000;
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
  border-radius: 20px;
  z-index: 20;
  animation: blink 2s infinite;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
}
@keyframes blink {
  0%, 100% { opacity: 0.9; }
  50% { opacity: 0.4; }
}

#gameOverMsg {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 30;
  color: #fff;
  text-align: center;
}
#gameOverMsg.show { display: flex; }
#gameOverMsg h1 {
  font-size: 42px;
  color: #ff5252;
  text-shadow: 0 0 20px #ff5252;
  margin-bottom: 20px;
}
#gameOverMsg p {
  font-size: 20px;
  margin-bottom: 10px;
  color: #ffd700;
}
#gameOverMsg button {
  margin-top: 25px;
  padding: 15px 50px;
  font-size: 22px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  background: #ffd700;
  color: #000;
  cursor: pointer;
}
#gameOverMsg button:hover { background: #ffe94a; }
</style>
</head>
<body>
<div id="game">
  <div id="world">
    <div id="ground"></div>
    <div id="car">
      <div id="carBody"><div id="carImg"></div></div>
    </div>
  </div>

  <div id="touchLeft"></div>
  <div id="touchRight"></div>

  <div id="hud">
    <div id="speedo">🚗 0 км/ч</div>
    <div id="coinHud">🪙 <span id="coinCount">0</span></div>
  </div>
  <div id="recordHud">🏆 Рекорд: <span id="recordValue">0</span></div>
  <div id="crashHud">💥 <span id="crashCount">0</span>/3</div>
  <div id="timerHud">🚨 <span id="copCount">0</span> копов · ⭐ <span id="scoreValue">0</span></div>
  <div id="driftHud">🔥 ДРИФТ! +10</div>
  <div id="alertMsg">🚨 КОПЫ!</div>

  <div id="hint">◀ ▶ руль · 2 пальца = назад</div>

  <div id="gameOverMsg">
    <h1>💥 РАЗБИЛСЯ!</h1>
    <p>Очков: <span id="finalScoreGame">0</span> ⭐</p>
    <p>Монет: <span id="finalCoinsGame">0</span> 🪙</p>
    <p style="color:#ffd700;">🏆 Рекорд: <span id="finalRecordGame">0</span></p>
    <p style="color:#aaa; font-size:14px;" id="newRecordMsg"></p>
    <button id="restartGameBtn">Заново</button>
  </div>
</div>

<script>
// ==== НАСТРОЙКИ ====
const MAX_SPEED = 8;
const REVERSE_SPEED = 3;
const ACCEL = 0.08;
const REVERSE_ACCEL = 0.12;
const TURN_SPEED = 0.045;
const TURN_SPEED_LOSS = 0.998;
const DRIFT_FACTOR = 0.75;
const DRIFT_THRESHOLD = 0.02;
const DRIFT_MIN_TIME = 1000;      // дрифт считается с 1 сек
const DRIFT_POINTS_PER_SEC = 10;  // очков за секунду дрифта
const IDLE_POINTS_PER_SEC = 1;    // очков за секунду езды
const SMOKE_INTERVAL_DRIFT = 60;  // мс между дымом при дрифте
const SMOKE_INTERVAL_IDLE = 220;  // мс между дымом при простой езде
const COIN_SPAWN_RADIUS = 800;
const COIN_COUNT = 60;
const MAX_CRASHES = 3;
const INVINCIBLE_TIME = 1500;

const FIRST_COP_TIME = 20000;
const COP_ADD_INTERVAL = 15000;
const MAX_COPS = 5;
const COP_STRAIGHT_SPEED = 9.0;
const COP_TURN_SPEED = 4.5;
const COP_SPEED_VAR = 0.4;
const COP_CAUGHT_DIST = 40;

// ==== ЭЛЕМЕНТЫ ====
const game = document.getElementById('game');
const world = document.getElementById('world');
const ground = document.getElementById('ground');
const carEl = document.getElementById('car');
const speedoEl = document.getElementById('speedo');
const coinCountEl = document.getElementById('coinCount');
const crashCountEl = document.getElementById('crashCount');
const driftHudEl = document.getElementById('driftHud');
const touchLeft = document.getElementById('touchLeft');
const touchRight = document.getElementById('touchRight');
const gameOverMsg = document.getElementById('gameOverMsg');
const finalCoinsGameEl = document.getElementById('finalCoinsGame');
const finalScoreGameEl = document.getElementById('finalScoreGame');
const finalRecordGameEl = document.getElementById('finalRecordGame');
const newRecordMsgEl = document.getElementById('newRecordMsg');
const restartGameBtn = document.getElementById('restartGameBtn');
const copCountEl = document.getElementById('copCount');
const scoreValueEl = document.getElementById('scoreValue');
const recordValueEl = document.getElementById('recordValue');
const alertMsg = document.getElementById('alertMsg');

// ==== СОСТОЯНИЕ ====
let car = { x: 0, y: 0, angle: 0, speed: 0, vx: 0, vy: 0, drifting: false, reversing: false };
let keys = { left: false, right: false, reverse: false };
let coins = [];
let obstacles = [];
let skidMarks = [];
let cops = [];
let lastSmoke = 0;
let lastIdleSmoke = 0;
let coinsCollected = 0;
let savedCoins = parseInt(localStorage.getItem('driftCoins') || '0');
let savedRecord = parseInt(localStorage.getItem('driftRecord') || '0');
let score = 0;                    // текущий счёт за забег
let driftStartTime = 0;           // когда начал дрифтить
let driftPointsGiven = 0;         // сколько очков уже начислили за текущий дрифт
let lastIdleScoreTime = 0;        // последнее начисление за езду
let lastCoinDist = 0;
let crashCount = 0;
let invincibleUntil = 0;
let gameRunning = true;
let gameStartTime = 0;
let lastCopSpawn = 0;
let copsSpawned = 0;
let gameOverReason = '';
let newRecord = false;

// ==== УТИЛИТЫ ====
function rand(min, max) { return Math.random() * (max - min) + min; }

function addScore(pts) {
  score += pts;
  scoreValueEl.textContent = score;
}

function showFloatScore(x, y, text) {
  const el = document.createElement('div');
  el.className = 'floatScore';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  game.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

// ==== ГЕНЕРАЦИЯ МИРА ====
function ensureWorldAround(x, y) {
  const dist = Math.hypot(x, y);
  if (dist - lastCoinDist < 400) return;
  lastCoinDist = dist;

  const c = document.createElement('div');
  c.className = 'coin';
  c.textContent = '🪙';
  const cx = x + rand(-COIN_SPAWN_RADIUS, COIN_SPAWN_RADIUS);
  const cy = y + rand(-COIN_SPAWN_RADIUS, COIN_SPAWN_RADIUS);
  c.style.left = (2000 + cx - 14) + 'px';
  c.style.top = (2000 + cy - 14) + 'px';
  ground.appendChild(c);
  coins.push({ el: c, x: cx, y: cy, collected: false });

  if (Math.random() < 0.5) {
    const o = document.createElement('div');
    o.className = 'obstacle' + (Math.random() < 0.5 ? ' rock' : '');
    const ox = x + rand(-COIN_SPAWN_RADIUS, COIN_SPAWN_RADIUS);
    const oy = y + rand(-COIN_SPAWN_RADIUS, COIN_SPAWN_RADIUS);
    o.style.left = (2000 + ox - 25) + 'px';
    o.style.top = (2000 + oy - 25) + 'px';
    ground.appendChild(o);
    obstacles.push({ el: o, x: ox, y: oy, r: 25 });
  }

  coins = coins.filter(c => {
    if (Math.hypot(c.x - x, c.y - y) > 2500) { c.el.remove(); return false; }
    return true;
  });
  obstacles = obstacles.filter(o => {
    if (Math.hypot(o.x - x, o.y - y) > 2500) { o.el.remove(); return false; }
    return true;
  });
}

function spawnInitialWorld() {
  coins.forEach(c => c.el.remove());
  obstacles.forEach(o => o.el.remove());
  coins = [];
  obstacles = [];
  for (let i = 0; i < COIN_COUNT; i++) {
    const c = document.createElement('div');
    c.className = 'coin';
    c.textContent = '🪙';
    const cx = rand(-1000, 1000);
    const cy = rand(-1000, 1000);
    c.style.left = (2000 + cx - 14) + 'px';
    c.style.top = (2000 + cy - 14) + 'px';
    ground.appendChild(c);
    coins.push({ el: c, x: cx, y: cy, collected: false });
  }
  for (let i = 0; i < 15; i++) {
    const o = document.createElement('div');
    o.className = 'obstacle' + (Math.random() < 0.5 ? ' rock' : '');
    const ox = rand(-1000, 1000);
    const oy = rand(-1000, 1000);
    o.style.left = (2000 + ox - 25) + 'px';
    o.style.top = (2000 + oy - 25) + 'px';
    ground.appendChild(o);
    obstacles.push({ el: o, x: ox, y: oy, r: 25 });
  }
}
spawnInitialWorld();

// ==== КОПЫ ====
function spawnCop() {
  if (copsSpawned >= MAX_COPS) return;
  copsSpawned++;

  const dist = 350;
  const backAngle = car.angle + Math.PI;
  const offsetAngle = backAngle + rand(-0.5, 0.5);
  const cx = car.x + Math.sin(offsetAngle) * dist;
  const cy = car.y - Math.cos(offsetAngle) * dist;

  const el = document.createElement('div');
  el.className = 'police';
  el.innerHTML = '<div class="policeBody"><div class="policeImg"></div></div>';
  world.appendChild(el);

  cops.push({
    el: el,
    x: cx,
    y: cy,
    angle: 0,
    speed: COP_TURN_SPEED,
    speedVar: rand(-COP_SPEED_VAR, COP_SPEED_VAR),
    vx: 0,
    vy: 0,
  });

  copCountEl.textContent = cops.length;
  alertMsg.classList.add('show');
  setTimeout(() => alertMsg.classList.remove('show'), 1500);
}

function updateCops(dt) {
  for (const cop of cops) {
    const dx = car.x - cop.x;
    const dy = car.y - cop.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.1) continue;

    const targetAngle = Math.atan2(dx, -dy);
    let angleDiff = targetAngle - cop.angle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    cop.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), 0.045 * dt);

    const alignment = Math.cos(angleDiff);
    const speedFactor = Math.max(0, alignment);
    const targetSpeed = COP_TURN_SPEED + (COP_STRAIGHT_SPEED - COP_TURN_SPEED) * speedFactor;
    cop.speed = cop.speed + (targetSpeed + cop.speedVar - cop.speed) * 0.05 * dt;

    const fwdX = Math.sin(cop.angle) * cop.speed;
    const fwdY = -Math.cos(cop.angle) * cop.speed;
    cop.vx += (fwdX - cop.vx) * 0.12 * dt;
    cop.vy += (fwdY - cop.vy) * 0.12 * dt;

    cop.x += cop.vx * dt;
    cop.y += cop.vy * dt;

    if (dist < COP_CAUGHT_DIST) {
      gameOverReason = '🚓 АРЕСТОВАН!';
      endGame();
      return;
    }
  }
}

// ==== УПРАВЛЕНИЕ ====
function bindTouch(el, key) {
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, { passive: false });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, { passive: false });
  el.addEventListener('touchcancel', () => { keys[key] = false; });
  el.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('mouseup', () => { keys[key] = false; });
  el.addEventListener('mouseleave', () => { keys[key] = false; });
}
bindTouch(touchLeft, 'left');
bindTouch(touchRight, 'right');

game.addEventListener('touchstart', (e) => {
  if (e.touches.length >= 2) {
    e.preventDefault();
    keys.reverse = true;
  }
}, { passive: false });

game.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) keys.reverse = false;
});

game.addEventListener('touchcancel', () => { keys.reverse = false; });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') keys.right = true;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'ы') keys.reverse = true;
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') keys.right = false;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'ы') keys.reverse = false;
});

// ==== ЭФФЕКТЫ ====
function spawnSmoke(x, y, type) {
  const s = document.createElement('div');
  s.className = 'smoke ' + type;
  s.style.left = (x - 10) + 'px';
  s.style.top = (y - 10) + 'px';
  ground.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

function spawnSkid(x, y, angle) {
  const s = document.createElement('div');
  s.className = 'skid';
  s.style.left = (x - 3) + 'px';
  s.style.top = (y - 10) + 'px';
  s.style.transform = 'rotate(' + angle + 'rad)';
  ground.appendChild(s);
  skidMarks.push(s);
  if (skidMarks.length > 200) skidMarks.shift().remove();
}

// ==== АВАРИЯ ====
function crash(now) {
  if (now < invincibleUntil) return;
  if (!gameRunning) return;

  crashCount++;
  crashCountEl.textContent = crashCount;
  invincibleUntil = now + INVINCIBLE_TIME;

  carEl.style.filter = 'brightness(3)';
  setTimeout(() => carEl.style.filter = '', 150);

  game.style.transform = 'translate(' + rand(-8, 8) + 'px, ' + rand(-8, 8) + 'px)';
  setTimeout(() => game.style.transform = '', 100);

  if (crashCount >= MAX_CRASHES) {
    gameOverReason = '💥 РАЗБИЛСЯ!';
    endGame();
  }
}

// ==== КОНЕЦ ИГРЫ ====
function endGame() {
  if (!gameRunning) return;
  gameRunning = false;

  newRecord = false;
  if (score > savedRecord) {
    savedRecord = score;
    localStorage.setItem('driftRecord', savedRecord);
    newRecord = true;
  }
  recordValueEl.textContent = savedRecord;

  finalScoreGameEl.textContent = score;
  finalCoinsGameEl.textContent = coinsCollected;
  finalRecordGameEl.textContent = savedRecord;
  newRecordMsgEl.textContent = newRecord ? '🎉 НОВЫЙ РЕКОРД!' : '';

  document.querySelector('#gameOverMsg h1').textContent = gameOverReason;
  gameOverMsg.classList.add('show');
}

// ==== РЕСТАРТ ====
restartGameBtn.addEventListener('click', () => {
  gameOverMsg.classList.remove('show');
  car.x = 0;
  car.y = 0;
  car.angle = 0;
  car.speed = 0;
  car.vx = 0;
  car.vy = 0;
  car.drifting = false;
  coinsCollected = 0;
  coinCountEl.textContent = savedCoins;
  crashCount = 0;
  crashCountEl.textContent = 0;
  invincibleUntil = 0;
  gameRunning = true;
  lastCoinDist = 0;
  gameStartTime = performance.now();
  lastCopSpawn = gameStartTime;
  copsSpawned = 0;
  copCountEl.textContent = 0;
  score = 0;
  scoreValueEl.textContent = 0;
  driftStartTime = 0;
  driftPointsGiven = 0;
  lastIdleScoreTime = gameStartTime;

  cops.forEach(c => c.el.remove());
  cops = [];

  spawnInitialWorld();
});

// ==== ИГРОВОЙ ЦИКЛ ====
let lastTime = performance.now();
gameStartTime = performance.now();
lastCopSpawn = gameStartTime;
lastIdleScoreTime = gameStartTime;

function loop(now) {
  const dt = Math.min((now - lastTime) / 16.67, 2);
  const dtMs = now - lastTime;
  lastTime = now;

  if (!gameRunning) {
    requestAnimationFrame(loop);
    return;
  }

  // Спавн копов
  const elapsed = now - gameStartTime;
  if (elapsed > FIRST_COP_TIME) {
    if (copsSpawned === 0) {
      spawnCop();
      lastCopSpawn = now;
    } else if (now - lastCopSpawn > COP_ADD_INTERVAL && copsSpawned < MAX_COPS) {
      spawnCop();
      lastCopSpawn = now;
    }
  }

  // Очки за езду: +1 в секунду
  if (now - lastIdleScoreTime >= 1000) {
    const secondsPassed = Math.floor((now - lastIdleScoreTime) / 1000);
    addScore(secondsPassed * IDLE_POINTS_PER_SEC);
    lastIdleScoreTime += secondsPassed * 1000;
  }

  // Управление
  let turnInput = 0;
  if (keys.left) turnInput -= 1;
  if (keys.right) turnInput += 1;

  const turnAmount = TURN_SPEED * turnInput * Math.min(car.speed / 2, 1.2) * dt;
  car.angle += turnAmount;

  car.reversing = keys.reverse;

  if (car.reversing) {
    car.speed -= REVERSE_ACCEL * dt;
    car.speed = Math.max(car.speed, -REVERSE_SPEED);
  } else {
    car.speed += ACCEL * dt;
    car.speed = Math.min(car.speed, MAX_SPEED);
  }

  if (turnInput !== 0) car.speed *= TURN_SPEED_LOSS;

  const forwardX = Math.sin(car.angle) * car.speed;
  const forwardY = -Math.cos(car.angle) * car.speed;

  const driftAmount = Math.abs(turnInput) * Math.abs(car.speed) * DRIFT_FACTOR * 0.1;
  car.vx += (forwardX - car.vx) * (0.15 - driftAmount * 0.01) * dt;
  car.vy += (forwardY - car.vy) * (0.15 - driftAmount * 0.01) * dt;

  car.drifting = Math.abs(turnInput) > 0 && Math.abs(car.speed) > 3 && driftAmount > DRIFT_THRESHOLD;

  car.x += car.vx * dt;
  car.y += car.vy * dt;

  // ==== ДРИФТ ОЧКИ ====
  if (car.drifting) {
    if (driftStartTime === 0) {
      driftStartTime = now;
      driftPointsGiven = 0;
    } else {
      const driftDuration = now - driftStartTime;
      if (driftDuration >= DRIFT_MIN_TIME) {
        const secondsDrifting = Math.floor(driftDuration / 1000);
        const pointsShouldBe = secondsDrifting * DRIFT_POINTS_PER_SEC;
        if (pointsShouldBe > driftPointsGiven) {
          const gained = pointsShouldBe - driftPointsGiven;
          addScore(gained);
          driftPointsGiven = pointsShouldBe;
          const camX = game.clientWidth / 2;
          const camY = game.clientHeight / 2;
          showFloatScore(camX + 30, camY - 60, '+' + gained);
        }
      }
    }
  } else {
    driftStartTime = 0;
    driftPointsGiven = 0;
  }

  // Столкновения
  for (const o of obstacles) {
    const d = Math.hypot(car.x - o.x, car.y - o.y);
    if (d < o.r + 25) {
      const ang = Math.atan2(car.y - o.y, car.x - o.x);
      car.x = o.x + Math.cos(ang) * (o.r + 25);
      car.y = o.y + Math.sin(ang) * (o.r + 25);
      car.speed *= 0.3;
      car.vx *= 0.3;
      car.vy *= 0.3;
      crash(now);
    }
  }

  // Монеты
  for (const c of coins) {
    if (c.collected) continue;
    if (Math.hypot(car.x - c.x, car.y - c.y) < 30) {
      c.collected = true;
      c.el.remove();
      coinsCollected++;
      savedCoins++;
      localStorage.setItem('driftCoins', savedCoins);
      coinCountEl.textContent = savedCoins;
    }
  }

  ensureWorldAround(car.x, car.y);
  updateCops(dt);

  // Камера
  const camX = game.clientWidth / 2;
  const camY = game.clientHeight / 2;
  ground.style.transform = 'translate(' + (camX - car.x) + 'px, ' + (camY - car.y) + 'px)';

  carEl.style.left = (camX - 28) + 'px';
  carEl.style.top = (camY - 50) + 'px';
  carEl.style.transform = 'rotate(' + car.angle + 'rad)';

  if (now < invincibleUntil) {
    carEl.style.opacity = (Math.floor(now / 100) % 2) ? '0.3' : '1';
  } else {
    carEl.style.opacity = '1';
  }

  for (const cop of cops) {
    cop.el.style.left = (camX + (cop.x - car.x) - 28) + 'px';
    cop.el.style.top = (camY + (cop.y - car.y) - 50) + 'px';
    cop.el.style.transform = 'rotate(' + cop.angle + 'rad)';
  }

  // ==== ДЫМ ====
  const backOffset = 25;
  const sideOffset = 22;
  const bx = car.x - Math.sin(car.angle) * backOffset;
  const by = car.y + Math.cos(car.angle) * backOffset;
  const px = Math.cos(car.angle) * sideOffset;
  const py = Math.sin(car.angle) * sideOffset;

  // Дым при дрифте
  if (car.drifting && now - lastSmoke > SMOKE_INTERVAL_DRIFT) {
    lastSmoke = now;
    spawnSmoke(2000 + bx - px, 2000 + by - py, 'drift');
    spawnSmoke(2000 + bx + px, 2000 + by + py, 'drift');
    spawnSkid(2000 + bx - px, 2000 + by - py, car.angle);
    spawnSkid(2000 + bx + px, 2000 + by + py, car.angle);
  }
  // Лёгкий дым при езде
  else if (!car.drifting && Math.abs(car.speed) > 1.5 && now - lastIdleSmoke > SMOKE_INTERVAL_IDLE) {
    lastIdleSmoke = now;
    if (Math.random() < 0.5) spawnSmoke(2000 + bx - px, 2000 + by - py, 'idle');
    else spawnSmoke(2000 + bx + px, 2000 + by + py, 'idle');
  }

  // HUD
  speedoEl.textContent = '🚗 ' + Math.round(car.speed * 25) + ' км/ч';
  driftHudEl.classList.toggle('show', car.drifting);

  requestAnimationFrame(loop);
}

recordValueEl.textContent = savedRecord;
coinCountEl.textContent = savedCoins;
requestAnimationFrame(loop);
</script>
</body>
