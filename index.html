<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            font-family: sans-serif;
        }
        #startBtn {
            padding: 30px 60px;
            font-size: 32px;
            color: white;
            background: #e63946;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.6);
            transition: 0.2s;
        }
        #startBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <button id="startBtn">НАЧАТЬ</button>

    <!-- Сюда положи свой файл со стонами -->
    <audio id="moans">
        <source src="moans.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('startBtn');
        const moans = document.getElementById('moans');
        let started = false;

        btn.addEventListener('click', function() {
            if (started) return;
            started = true;

            // Скрываем кнопку
            btn.style.display = 'none';

            // Врубаем стоны на полную
            moans.volume = 1.0;
            moans.play();
        });
    </script>
</body>
</html>
