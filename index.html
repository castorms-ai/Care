<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0000aa;
            color: white;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 3px;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .progress-container {
            width: 85%;
            max-width: 450px;
            height: 28px;
            border: 2px solid white;
            margin-bottom: 25px;
            background: #000055;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 0.1s;
        }
        #log {
            font-size: 15px;
            color: #ffffff;
            height: 30px;
            width: 85%;
            max-width: 450px;
            overflow: hidden;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <h1>ВЗЛОМ ДАННЫХ</h1>

    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="log">Инициализация...</div>

    <script>
        const logMessages = [
            "SYSTEM_UI", "SETTINGS_PROVIDER", "SECURE_SETTINGS", "WIFI_SERVICE",
            "BLUETOOTH_SERVICE", "AUDIO_SERVICE", "CAMERA_SERVICE", "LOCATION_SERVICE",
            "PACKAGE_MANAGER", "ACTIVITY_MANAGER", "POWER_MANAGER", "BATTERY_STATS",
            "TELEPHONY_SERVICE", "CONNECTIVITY_SERVICE", "DOWNLOAD_MANAGER", "ACCOUNT_MANAGER",
            "CONTENT_PROVIDER", "MEDIA_STORE", "CONTACTS_PROVIDER", "CALENDAR_PROVIDER",
            "CALL_LOG", "SMS_PROVIDER", "USER_DICTIONARY", "INPUT_METHOD",
            "ACCESSIBILITY_SERVICE", "NOTIFICATION_SERVICE", "JOB_SCHEDULER", "ALARM_MANAGER",
            "VIBRATOR_SERVICE", "SENSOR_SERVICE", "STORAGE_MANAGER", "KEYGUARD_SERVICE",
            "FINGERPRINT_SERVICE", "TRUST_MANAGER", "NETWORK_STATS", "USB_SERVICE"
        ];

        let progress = 0;
        const logEl = document.getElementById('log');
        const progressBar = document.getElementById('progress-bar');

        // Прогресс-бар на 5 секунд
        const totalTime = 5000;
        const interval = 50;
        const step = 100 / (totalTime / interval);

        const progressInterval = setInterval(() => {
            progress += step;
            if (progress >= 100) {
                progress = 100;
                clearInterval(progressInterval);
                clearInterval(logInterval);
                progressBar.style.background = '#00ff00';
                logEl.textContent = "ПЕРЕДАЧА ЗАВЕРШЕНА";
            }
            progressBar.style.width = progress + '%';
        }, interval);

        // Быстро меняющийся текст каждые 0.2 секунды
        const logInterval = setInterval(() => {
            const msg = logMessages[Math.floor(Math.random() * logMessages.length)];
            logEl.textContent = msg;
        }, 200);
    </script>
</body>
</html>
