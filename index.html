<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Взлом профиля</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow-y: auto;
            padding: 15px;
        }

        /* ===== ШАПКА ===== */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        #header .stat {
            font-size: 14px;
        }
        #header .stat span {
            color: #00ff00;
            font-weight: bold;
        }
        #reputation { color: #ffaa00; }

        /* ===== ПРОФИЛЬ ===== */
        #profile {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        #profile .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin-bottom: 10px;
        }
        #profile h2 {
            color: #fff;
            font-size: 20px;
        }
        #profile .username {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }
        #profile .info {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }

        /* ===== ТАБЫ ===== */
        #tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab.active {
            background: #00ff00;
            color: #000;
            font-weight: bold;
            border-color: #00ff00;
        }

        /* ===== КОНТЕНТ ===== */
        #content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            min-height: 200px;
            margin-bottom: 15px;
        }
        .post {
            border-bottom: 1px solid #2a2a2a;
            padding: 12px 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .post:last-child { border-bottom: none; }
        .post:hover { background: #222; padding-left: 8px; }
        .post.found {
            background: #1a3a1a;
            border-left: 3px solid #00ff00;
            padding-left: 10px;
        }
        .post .text {
            font-size: 14px;
            color: #ddd;
            line-height: 1.5;
        }
        .post .meta {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .photo-item {
            background: #222;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 40px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .photo-item:hover { background: #2a2a2a; }
        .photo-item.found { border-color: #00ff00; background: #1a3a1a; }
        .friend {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            cursor: pointer;
            border-bottom: 1px solid #2a2a2a;
        }
        .friend:last-child { border-bottom: none; }
        .friend:hover { background: #222; }
        .friend.found { background: #1a3a1a; padding-left: 8px; }
        .friend .f-avatar {
            width: 35px; height: 35px;
            border-radius: 50%;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
        .friend .f-name { font-size: 14px; color: #ddd; }

        /* ===== ПОДСКАЗКИ ===== */
        #clues {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        #clues h3 {
            font-size: 14px;
            color: #ffaa00;
            margin-bottom: 10px;
        }
        .clue-item {
            font-size: 13px;
            color: #00ff00;
            padding: 5px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .clue-item:last-child { border-bottom: none; }
        .clue-empty {
            color: #555;
            font-size: 13px;
            font-style: italic;
        }

        /* ===== ВВОД ПАРОЛЯ ===== */
        #passwordSection {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        #passwordSection h3 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
        }
        #passwordInput {
            width: 100%;
            padding: 12px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            margin-bottom: 10px;
            outline: none;
        }
        #passwordInput:focus { border-color: #00ff00; }
        #submitBtn {
            width: 100%;
            padding: 12px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        #submitBtn:hover { background: #00cc00; }
        #submitBtn:disabled { background: #333; color: #666; cursor: not-allowed; }
        #attempts {
            font-size: 13px;
            color: #ff6666;
            margin-top: 8px;
            text-align: center;
        }

        /* ===== СООБЩЕНИЕ ===== */
        #message {
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        #message.success { background: #1a3a1a; color: #00ff00; border: 1px solid #00ff00; display: block; }
        #message.fail { background: #3a1a1a; color: #ff4444; border: 1px solid #ff4444; display: block; }

        /* ===== КНОПКА НОВОГО ЗАДАНИЯ ===== */
        #nextBtn {
            width: 100%;
            padding: 12px;
            background: #ffaa00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div id="header">
        <div class="stat">💰 <span id="money">0</span>₽</div>
        <div class="stat">⭐ <span id="reputation">100</span></div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile">
        <div class="avatar">👤</div>
        <h2>Вася Петров</h2>
        <div class="username">@vasya_2008</div>
        <div class="info">
            🎂 15.06.2008<br>
            🏙 Москва<br>
            ⚽ Спартак<br>
            🐱 Кот Барсик
        </div>
    </div>

    <!-- ТАБЫ -->
    <div id="tabs">
        <button class="tab active" data-tab="posts">📝 Посты</button>
        <button class="tab" data-tab="photos">📷 Фото</button>
        <button class="tab" data-tab="friends">👥 Друзья</button>
    </div>

    <!-- КОНТЕНТ -->
    <div id="content"></div>

    <!-- ПОДСКАЗКИ -->
    <div id="clues">
        <h3>🔍 Найденные подсказки:</h3>
        <div id="clueList">
            <div class="clue-empty">Пока ничего не найдено... Ищи внимательно.</div>
        </div>
    </div>

    <!-- ВВОД ПАРОЛЯ -->
    <div id="passwordSection">
        <h3>🔐 Введи пароль:</h3>
        <input type="text" id="passwordInput" placeholder="Пароль..." autocomplete="off">
        <button id="submitBtn">ВЗЛОМАТЬ</button>
        <div id="attempts">Попыток осталось: 3</div>
    </div>

    <!-- СООБЩЕНИЕ -->
    <div id="message"></div>

    <!-- КНОПКА СЛЕДУЮЩЕГО ЗАДАНИЯ -->
    <button id="nextBtn">СЛЕДУЮЩЕЕ ЗАДАНИЕ</button>

    <script>
        // ===== ДАННЫЕ =====
        const target = {
            name: "Вася Петров",
            password: "Barsik2008",
            clues: ["Барсик", "2008", "15.06"]
        };

        let foundClues = [];
        let attempts = 3;
        let money = 0;
        let reputation = 100;
        let gameOver = false;

        // ===== КОНТЕНТ ПОСТОВ =====
        const posts = [
            { text: "Сегодня Барсик опять скинул вазу. Этот кот меня доконает! 😾", meta: "2 часа назад", clue: "Барсик" },
            { text: "Смотрел матч Спартак - Зенит. Обидно проиграли...", meta: "5 часов назад", clue: null },
            { text: "Днюха была огонь! Спасибо всем, кто пришёл! 🎂", meta: "3 дня назад", clue: null },
            { text: "Купил новый корм для кота. Барсик доволен.", meta: "1 неделя назад", clue: null },
            { text: "Кто в CS:GO? Го катать вечером.", meta: "2 недели назад", clue: null },
        ];

        const photos = [
            { emoji: "🎂", caption: "День рождения! Торт с цифрой 15", clue: "15.06" },
            { emoji: "🐱", caption: "Мой кот Барсик", clue: null },
            { emoji: "⚽", caption: "На матче Спартака", clue: null },
            { emoji: "🎮", caption: "Играю в CS", clue: null },
        ];

        const friends = [
            { name: "Петя Иванов", emoji: "👦", clue: null },
            { name: "Маша Сидорова", emoji: "👧", clue: null },
            { name: "Коля Смирнов", emoji: "🧑", clue: null },
            { name: "Аня Кузнецова", emoji: "👩", clue: null },
        ];

        // ===== ОТРИСОВКА =====
        function renderContent(tab) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            if (tab === 'posts') {
                posts.forEach((post, i) => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    if (post.clue && foundClues.includes(post.clue)) div.classList.add('found');
                    div.innerHTML = `<div class="text">${post.text}</div><div class="meta">${post.meta}</div>`;
                    div.addEventListener('click', () => findClue(post.clue, i));
                    content.appendChild(div);
                });
            } else if (tab === 'photos') {
                const grid = document.createElement('div');
                grid.className = 'photo-grid';
                photos.forEach((photo, i) => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    if (photo.clue && foundClues.includes(photo.clue)) div.classList.add('found');
                    div.innerHTML = `${photo.emoji}<div style="font-size:11px; color:#888; margin-top:5px;">${photo.caption}</div>`;
                    div.addEventListener('click', () => findClue(photo.clue, i));
                    grid.appendChild(div);
                });
                content.appendChild(grid);
            } else if (tab === 'friends') {
                friends.forEach((friend, i) => {
                    const div = document.createElement('div');
                    div.className = 'friend';
                    div.innerHTML = `<div class="f-avatar">${friend.emoji}</div><div class="f-name">${friend.name}</div>`;
                    div.addEventListener('click', () => findClue(friend.clue, i));
                    content.appendChild(div);
                });
            }
        }

        // ===== ПОИСК ПОДСКАЗКИ =====
        function findClue(clue, index) {
            if (!clue) {
                // Пустышка — ничего не найдено
                showMessage("Ничего интересного...", "fail");
                return;
            }
            if (foundClues.includes(clue)) {
                showMessage("Эта подсказка уже найдена.", "fail");
                return;
            }
            foundClues.push(clue);
            updateClues();
            renderContent(document.querySelector('.tab.active').dataset.tab);
            showMessage(`🔍 Найдена подсказка: ${clue}`, "success");
        }

        // ===== ОБНОВЛЕНИЕ ПОДСКАЗОК =====
        function updateClues() {
            const list = document.getElementById('clueList');
            if (foundClues.length === 0) {
                list.innerHTML = '<div class="clue-empty">Пока ничего не найдено... Ищи внимательно.</div>';
            } else {
                list.innerHTML = foundClues.map(c => `<div class="clue-item">✓ ${c}</div>`).join('');
            }
        }

        // ===== СООБЩЕНИЕ =====
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = type;
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }

        // ===== ПРОВЕРКА ПАРОЛЯ =====
        document.getElementById('submitBtn').addEventListener('click', () => {
            if (gameOver) return;
            const input = document.getElementById('passwordInput').value.trim();

            if (input === target.password) {
                // УСПЕХ
                gameOver = true;
                money += 1000;
                reputation += 50;
                updateStats();
                showMessage("✅ ДОСТУП ПОЛУЧЕН! +1000₽, +50 репутации", "success");
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                // ПРОВАЛ
                attempts--;
                document.getElementById('attempts').textContent = `Попыток осталось: ${attempts}`;
                if (attempts <= 0) {
                    gameOver = true;
                    reputation -= 20;
                    updateStats();
                    showMessage("❌ ВЗЛОМ НЕ УДАЛСЯ. -20 репутации", "fail");
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('nextBtn').style.display = 'block';
                } else {
                    showMessage(`❌ Неверный пароль. Осталось попыток: ${attempts}`, "fail");
                }
            }
        });

        // ===== ОБНОВЛЕНИЕ СТАТИСТИКИ =====
        function updateStats() {
            document.getElementById('money').textContent = money;
            document.getElementById('reputation').textContent = reputation;
        }

        // ===== СЛЕДУЮЩЕЕ ЗАДАНИЕ (заглушка) =====
        document.getElementById('nextBtn').addEventListener('click', () => {
            showMessage("Новое задание скоро... (в разработке)", "success");
        });

        // ===== ТАБЫ =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderContent(tab.dataset.tab);
            });
        });

        // ===== СТАРТ =====
        renderContent('posts');
        updateStats();
    </script>
</body>
</html>
