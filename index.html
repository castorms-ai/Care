<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тёмный заказчик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            height: 100dvh; /* для мобильных браузеров */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== ШАПКА ===== */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 12px 15px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        #header .stat { font-size: 14px; }
        #header .stat span { color: #00ff00; font-weight: bold; }
        #reputation { color: #ffaa00; }

        /* ===== ЧАТ ===== */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d0d0d;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.anon {
            align-self: flex-start;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ddd;
        }
        .message.anon .sender {
            color: #ff4444;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .message.user {
            align-self: flex-end;
            background: #1a3a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .message .time {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
            text-align: right;
        }

        /* ===== КНОПКИ ЗАДАНИЯ ===== */
        .task-buttons {
            display: flex;
            gap: 10px;
            align-self: flex-start;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }
        .task-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-btn.accept {
            background: #00ff00;
            color: #000;
        }
        .task-btn.accept:hover { background: #00cc00; }
        .task-btn.decline {
            background: #333;
            color: #aaa;
        }
        .task-btn.decline:hover { background: #444; }

        /* ===== ПАНЕЛЬ ВЗЛОМА ===== */
        #hackPanel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
        }
        #hackPanel.active { display: flex; }

        #hackHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }
        #hackHeader h2 {
            color: #ff4444;
            font-size: 18px;
        }
        #closeHack {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        /* ===== ПРОФИЛЬ ЦЕЛИ ===== */
        #profile {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        #profile .avatar {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            margin-bottom: 10px;
        }
        #profile h2 { color: #fff; font-size: 18px; }
        #profile .username { color: #888; font-size: 13px; margin-bottom: 6px; }
        #profile .info { font-size: 12px; color: #aaa; line-height: 1.5; }

        /* ===== ТАБЫ ===== */
        #tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
        }
        .tab.active {
            background: #00ff00;
            color: #000;
            font-weight: bold;
            border-color: #00ff00;
        }

        #content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            min-height: 150px;
            margin-bottom: 12px;
        }
        .post {
            border-bottom: 1px solid #2a2a2a;
            padding: 10px 0;
            cursor: pointer;
            font-size: 13px;
        }
        .post:last-child { border-bottom: none; }
        .post:hover { background: #222; padding-left: 6px; }
        .post.found { background: #1a3a1a; border-left: 3px solid #00ff00; padding-left: 8px; }
        .post .meta { font-size: 10px; color: #666; margin-top: 4px; }

        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .photo-item {
            background: #222;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 32px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .photo-item:hover { background: #2a2a2a; }
        .photo-item.found { border-color: #00ff00; background: #1a3a1a; }

        .friend {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            cursor: pointer;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }
        .friend:last-child { border-bottom: none; }
        .friend:hover { background: #222; }
        .friend .f-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        /* ===== ПОДСКАЗКИ ===== */
        #clues {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        #clues h3 { font-size: 13px; color: #ffaa00; margin-bottom: 8px; }
        .clue-item { font-size: 12px; color: #00ff00; padding: 3px 0; }
        .clue-empty { color: #555; font-size: 12px; font-style: italic; }

        /* ===== ВВОД ПАРОЛЯ ===== */
        #passwordSection {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        #passwordSection h3 { font-size: 13px; color: #fff; margin-bottom: 8px; }
        #passwordInput {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            margin-bottom: 8px;
            outline: none;
        }
        #passwordInput:focus { border-color: #00ff00; }
        #submitBtn {
            width: 100%;
            padding: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        #submitBtn:disabled { background: #333; color: #666; cursor: not-allowed; }
        #attempts { font-size: 12px; color: #ff6666; margin-top: 6px; text-align: center; }

        /* ===== СООБЩЕНИЕ ===== */
        #message {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        #message.success { background: #1a3a1a; color: #00ff00; border: 1px solid #00ff00; display: block; }
        #message.fail { background: #3a1a1a; color: #ff4444; border: 1px solid #ff4444; display: block; }

        #nextBtn {
            width: 100%;
            padding: 12px;
            background: #ffaa00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div id="header">
        <div class="stat">💰 <span id="money">0</span>₽</div>
        <div class="stat">⭐ <span id="reputation">100</span></div>
    </div>

    <!-- ЧАТ -->
    <div id="chat"></div>

    <!-- ПАНЕЛЬ ВЗЛОМА (скрыта) -->
    <div id="hackPanel">
        <div id="hackHeader">
            <h2>🔓 ВЗЛОМ: Вася Петров</h2>
            <button id="closeHack">ЗАКРЫТЬ</button>
        </div>

        <div id="profile">
            <div class="avatar">👤</div>
            <h2>Вася Петров</h2>
            <div class="username">@vasya_2008</div>
            <div class="info">
                🎂 15.06.2008<br>
                🏙 Москва<br>
                ⚽ Спартак<br>
                🐱 Кот Барсик
            </div>
        </div>

        <div id="tabs">
            <button class="tab active" data-tab="posts">📝 Посты</button>
            <button class="tab" data-tab="photos">📷 Фото</button>
            <button class="tab" data-tab="friends">👥 Друзья</button>
        </div>

        <div id="content"></div>

        <div id="clues">
            <h3>🔍 Найденные подсказки:</h3>
            <div id="clueList">
                <div class="clue-empty">Пока ничего не найдено...</div>
            </div>
        </div>

        <div id="passwordSection">
            <h3>🔐 Введи пароль:</h3>
            <input type="text" id="passwordInput" placeholder="Пароль..." autocomplete="off">
            <button id="submitBtn">ВЗЛОМАТЬ</button>
            <div id="attempts">Попыток осталось: 3</div>
        </div>

        <div id="message"></div>
        <button id="nextBtn">СЛЕДУЮЩЕЕ ЗАДАНИЕ</button>
    </div>

    <script>
        // ===== ДАННЫЕ =====
        const target = {
            name: "Вася Петров",
            password: "Barsik2008",
        };

        let foundClues = [];
        let attempts = 3;
        let money = 0;
        let reputation = 100;
        let gameOver = false;

        const posts = [
            { text: "Сегодня Барсик опять скинул вазу. Этот кот меня доконает! 😾", meta: "2 часа назад", clue: "Барсик" },
            { text: "Смотрел матч Спартак - Зенит. Обидно проиграли...", meta: "5 часов назад", clue: null },
            { text: "Днюха была огонь! Спасибо всем, кто пришёл! 🎂", meta: "3 дня назад", clue: null },
            { text: "Купил новый корм для кота. Барсик доволен.", meta: "1 неделя назад", clue: null },
            { text: "Кто в CS:GO? Го катать вечером.", meta: "2 недели назад", clue: null },
        ];

        const photos = [
            { emoji: "🎂", caption: "День рождения! Торт с цифрой 15", clue: "15.06" },
            { emoji: "🐱", caption: "Мой кот Барсик", clue: null },
            { emoji: "⚽", caption: "На матче Спартака", clue: null },
            { emoji: "🎮", caption: "Играю в CS", clue: null },
        ];

        const friends = [
            { name: "Петя Иванов", emoji: "👦", clue: null },
            { name: "Маша Сидорова", emoji: "👧", clue: null },
            { name: "Коля Смирнов", emoji: "🧑", clue: null },
            { name: "Аня Кузнецова", emoji: "👩", clue: null },
        ];

        // ===== ЧАТ =====
        const chat = document.getElementById('chat');

        function addMessage(text, sender = 'anon', delay = 0) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = `message ${sender}`;
                    const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    
                    if (sender === 'anon') {
                        div.innerHTML = `<div class="sender">_X_</div>${text}<div class="time">${time}</div>`;
                    } else {
                        div.innerHTML = `${text}<div class="time">${time}</div>`;
                    }
                    
                    chat.appendChild(div);
                    
                    // Мгновенный скролл + повторный через 100мс для надёжности
                    chat.scrollTop = chat.scrollHeight;
                    setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 100);
                    
                    resolve();
                }, delay);
            });
        }

        // ===== НАЧАЛО ИГРЫ =====
        async function startGame() {
            await addMessage("Привет.", "anon", 500);
            await addMessage("Ты знаешь, зачем я здесь.", "anon", 1200);
            await addMessage("Я даю тебе работу. Ты выполняешь. Деньги получаешь.", "anon", 2500);
            await addMessage("Если попадёшься — меня не знаешь. Договорились?", "anon", 4000);
            await addMessage("Первое задание простое. Взломай страницу одноклассника. Его зовут Вася Петров.", "anon", 5500);
            await addMessage("Найди подсказки в его профиле. Угадаешь пароль — получишь 1000₽.", "anon", 7000);
            await addMessage("⚠️ 3 попытки. Провалишь — потеряешь 20 репутации.", "anon", 8500);

            // Кнопки задания — через 2 секунды после последнего сообщения
            await new Promise(resolve => {
                setTimeout(() => {
                    const buttons = document.createElement('div');
                    buttons.className = 'task-buttons';
                    buttons.innerHTML = `
                        <button class="task-btn accept" id="acceptBtn">✅ ПРИНЯТЬ</button>
                        <button class="task-btn decline" id="declineBtn">❌ ОТКЛОНИТЬ</button>
                    `;
                    chat.appendChild(buttons);
                    
                    // Скролл после добавления кнопок
                    chat.scrollTop = chat.scrollHeight;
                    setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 100);

                    document.getElementById('acceptBtn').addEventListener('click', () => {
                        buttons.remove();
                        addMessage("Принято. Удачи.", "anon", 500);
                        addMessage("Открываю доступ к его странице...", "anon", 1500);
                        setTimeout(() => {
                            document.getElementById('hackPanel').classList.add('active');
                        }, 2000);
                        resolve();
                    });

                    document.getElementById('declineBtn').addEventListener('click', () => {
                        buttons.remove();
                        addMessage("Хм. Ладно. Но учти, я не люблю отказы.", "anon", 500);
                        addMessage("Предлагаю ещё раз. Взломай Васю.", "anon", 1500);
                        startGame();
                        resolve();
                    });
                }, 2000);
            });
        }

        // ===== ОТРИСОВКА КОНТЕНТА =====
        function renderContent(tab) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            if (tab === 'posts') {
                posts.forEach((post) => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    if (post.clue && foundClues.includes(post.clue)) div.classList.add('found');
                    div.innerHTML = `<div>${post.text}</div><div class="meta">${post.meta}</div>`;
                    div.addEventListener('click', () => findClue(post.clue));
                    content.appendChild(div);
                });
            } else if (tab === 'photos') {
                const grid = document.createElement('div');
                grid.className = 'photo-grid';
                photos.forEach((photo) => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    if (photo.clue && foundClues.includes(photo.clue)) div.classList.add('found');
                    div.innerHTML = `${photo.emoji}<div style="font-size:10px; color:#888; margin-top:4px;">${photo.caption}</div>`;
                    div.addEventListener('click', () => findClue(photo.clue));
                    grid.appendChild(div);
                });
                content.appendChild(grid);
            } else if (tab === 'friends') {
                friends.forEach((friend) => {
                    const div = document.createElement('div');
                    div.className = 'friend';
                    div.innerHTML = `<div class="f-avatar">${friend.emoji}</div><div>${friend.name}</div>`;
                    div.addEventListener('click', () => findClue(friend.clue));
                    content.appendChild(div);
                });
            }
        }

        // ===== ПОИСК ПОДСКАЗКИ =====
        function findClue(clue) {
            if (!clue) {
                showMessage("Ничего интересного...", "fail");
                return;
            }
            if (foundClues.includes(clue)) {
                showMessage("Уже найдено.", "fail");
                return;
            }
            foundClues.push(clue);
            updateClues();
            renderContent(document.querySelector('.tab.active').dataset.tab);
            showMessage(`🔍 Найдена подсказка: ${clue}`, "success");
        }

        function updateClues() {
            const list = document.getElementById('clueList');
            if (foundClues.length === 0) {
                list.innerHTML = '<div class="clue-empty">Пока ничего не найдено...</div>';
            } else {
                list.innerHTML = foundClues.map(c => `<div class="clue-item">✓ ${c}</div>`).join('');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = type;
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }

        // ===== ПРОВЕРКА ПАРОЛЯ =====
        document.getElementById('submitBtn').addEventListener('click', () => {
            if (gameOver) return;
            const input = document.getElementById('passwordInput').value.trim();

            if (input === target.password) {
                gameOver = true;
                money += 1000;
                reputation += 50;
                updateStats();
                showMessage("✅ ДОСТУП ПОЛУЧЕН! +1000₽, +50 репутации", "success");
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                attempts--;
                document.getElementById('attempts').textContent = `Попыток осталось: ${attempts}`;
                if (attempts <= 0) {
                    gameOver = true;
                    reputation -= 20;
                    updateStats();
                    showMessage("❌ ВЗЛОМ НЕ УДАЛСЯ. -20 репутации", "fail");
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('nextBtn').style.display = 'block';
                } else {
                    showMessage(`❌ Неверный пароль. Осталось: ${attempts}`, "fail");
                }
            }
        });

        function updateStats() {
            document.getElementById('money').textContent = money;
            document.getElementById('reputation').textContent = reputation;
        }

        // ===== ЗАКРЫТИЕ ПАНЕЛИ =====
        document.getElementById('closeHack').addEventListener('click', () => {
            document.getElementById('hackPanel').classList.remove('active');
        });

        // ===== СЛЕДУЮЩЕЕ ЗАДАНИЕ =====
        document.getElementById('nextBtn').addEventListener('click', () => {
            document.getElementById('hackPanel').classList.remove('active');
            addMessage("Неплохо. Держи награду. Следующее задание скоро...", "anon", 500);
            addMessage("(В разработке)", "anon", 2000);
        });

        // ===== ТАБЫ =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderContent(tab.dataset.tab);
            });
        });

        // ===== СТАРТ =====
        updateStats();
        startGame();
    </script>
</body>
</html>
