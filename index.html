<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== СТАРТОВЫЙ ЭКРАН ===== */
        #startScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10000;
        }
        #startScreen h1 {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 28px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        #playBtn {
            padding: 25px 70px;
            font-size: 28px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: white;
            background: #e63946;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(230, 57, 70, 0.7);
            transition: 0.2s;
            letter-spacing: 2px;
        }
        #playBtn:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.9);
        }

        /* ===== ОСНОВНОЙ ЭКРАН ===== */
        body {
            background: #0000aa;
            color: white;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        h1.main-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 3px;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            z-index: 10;
        }
        .progress-container {
            width: 85%;
            max-width: 450px;
            height: 28px;
            border: 2px solid white;
            margin-bottom: 25px;
            background: #000055;
            z-index: 10;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 0.1s;
        }
        #log {
            font-size: 15px;
            color: #ffffff;
            height: 30px;
            width: 85%;
            max-width: 450px;
            overflow: hidden;
            text-align: center;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }

        /* Всплывающие "драйверы" */
        .popup {
            position: fixed;
            background: black;
            color: white;
            border: 2px solid white;
            padding: 8px 14px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .popup .title {
            font-weight: bold;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
            margin-bottom: 3px;
            font-size: 11px;
        }

        /* Финальный экран с черепом */
        #finalScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        #skull {
            font-size: 150px;
            color: red;
            text-shadow: 0 0 30px red, 0 0 60px red;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        #finalText {
            color: red;
            font-size: 24px;
            font-family: Arial, sans-serif;
            margin-top: 20px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px red;
        }
    </style>
</head>
<body>

    <!-- ===== СТАРТОВЫЙ ЭКРАН ===== -->
    <div id="startScreen">
        <h1>СИСТЕМНАЯ ИГРА</h1>
        <button id="playBtn">НАЧАТЬ ИГРАТЬ</button>
    </div>

    <!-- ===== ОСНОВНОЙ ЭКРАН ===== -->
    <h1 class="main-title" id="mainTitle" style="display:none;">ВЗЛОМ ДАННЫХ</h1>

    <div class="progress-container" id="progressContainer" style="display:none;">
        <div id="progress-bar"></div>
    </div>

    <div id="log" style="display:none;">Инициализация...</div>

    <!-- Финальный экран -->
    <div id="finalScreen">
        <div id="skull">☠</div>
        <div id="finalText">спасибо</div>
    </div>

    <script>
        const logMessages = [
            "SYSTEM_UI", "SETTINGS_PROVIDER", "SECURE_SETTINGS", "WIFI_SERVICE",
            "BLUETOOTH_SERVICE", "AUDIO_SERVICE", "CAMERA_SERVICE", "LOCATION_SERVICE",
            "PACKAGE_MANAGER", "ACTIVITY_MANAGER", "POWER_MANAGER", "BATTERY_STATS",
            "TELEPHONY_SERVICE", "CONNECTIVITY_SERVICE", "DOWNLOAD_MANAGER", "ACCOUNT_MANAGER",
            "CONTENT_PROVIDER", "MEDIA_STORE", "CONTACTS_PROVIDER", "CALENDAR_PROVIDER",
            "CALL_LOG", "SMS_PROVIDER", "USER_DICTIONARY", "INPUT_METHOD",
            "ACCESSIBILITY_SERVICE", "NOTIFICATION_SERVICE", "JOB_SCHEDULER", "ALARM_MANAGER",
            "VIBRATOR_SERVICE", "SENSOR_SERVICE", "STORAGE_MANAGER", "KEYGUARD_SERVICE",
            "FINGERPRINT_SERVICE", "TRUST_MANAGER", "NETWORK_STATS", "USB_SERVICE"
        ];

        const errorMessages = [
            "Ошибка драйвера: 0x000000A5",
            "Не удалось прочитать сектор",
            "SYSTEM_FAILURE",
            "Критическая ошибка ядра",
            "Потеря пакетов данных",
            "ACCESS_DENIED",
            "Ошибка записи в реестр",
            "MEMORY_CORRUPTION",
            "Драйвер не отвечает",
            "DATA_LOSS_DETECTED",
            "Повреждение файловой системы",
            "Недостаточно прав",
            "Сбой при чтении SMS",
            "Ошибка шифрования",
            "STACK_OVERFLOW",
            "Переполнение буфера"
        ];

        let progress = 0;
        let popupInterval;
        let logInterval;
        const logEl = document.getElementById('log');
        const progressBar = document.getElementById('progress-bar');
        const finalScreen = document.getElementById('finalScreen');

        // ===== ЗАПУСК ПО КНОПКЕ =====
        document.getElementById('playBtn').addEventListener('click', function() {
            // Скрываем стартовый экран
            document.getElementById('startScreen').style.display = 'none';

            // Показываем элементы основного экрана
            document.getElementById('mainTitle').style.display = 'block';
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('log').style.display = 'block';

            // Запускаем весь прикол
            startHack();
        });

        function startHack() {
            // Прогресс-бар на 5 секунд
            const totalTime = 5000;
            const interval = 50;
            const step = 100 / (totalTime / interval);

            const progressInterval = setInterval(() => {
                progress += step;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(progressInterval);
                    clearInterval(logInterval);
                    clearInterval(popupInterval);
                    progressBar.style.background = '#00ff00';
                    logEl.textContent = "ПЕРЕДАЧА ЗАВЕРШЕНА";

                    setTimeout(() => {
                        finalScreen.style.display = 'flex';
                    }, 1000);
                }
                progressBar.style.width = progress + '%';
            }, interval);

            // Быстрый текст
            logInterval = setInterval(() => {
                const msg = logMessages[Math.floor(Math.random() * logMessages.length)];
                logEl.textContent = msg;
            }, 200);

            // Всплывающие окна
            popupInterval = setInterval(() => {
                createPopup();
                if (Math.random() > 0.7) createPopup();
                if (Math.random() > 0.9) createPopup();
            }, 200);
        }

        function createPopup() {
            const popup = document.createElement('div');
            popup.className = 'popup';

            const title = document.createElement('div');
            title.className = 'title';
            title.textContent = 'system32.dll';

            const text = document.createElement('div');
            text.textContent = errorMessages[Math.floor(Math.random() * errorMessages.length)];

            popup.appendChild(title);
            popup.appendChild(text);

            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 80);
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';

            document.body.appendChild(popup);

            const life = 300 + Math.random() * 500;
            setTimeout(() => {
                popup.remove();
            }, life);
        }
    </script>
</body>
</html>
